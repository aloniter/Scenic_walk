<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scenic Walk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <!-- Form Screen -->
    <section id="form-screen" class="screen active">
      <header class="app-header">
        <h1>Scenic Walk</h1>
        <p class="tagline">Discover beautiful walking routes</p>
      </header>

      <form id="route-form" novalidate>
        <div class="input-group">
          <label for="origin">From</label>
          <div class="input-row">
            <input type="text" id="origin" placeholder="Address or place" required>
            <button type="button" id="use-location" class="location-btn" title="Use my location">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="input-group">
          <label for="destination">To</label>
          <input type="text" id="destination" placeholder="Address or place" required>
        </div>

        <div class="input-group">
          <label>I want to see (choose one or more)</label>
          <div class="chip-group" id="preference-chips">
            <button type="button" class="chip" data-value="sea">
              <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M0 10c2 2 4 2 6 0s4-2 6 0 4 2 6 0 4-2 6 0"/>
                <path d="M0 16c2 2 4 2 6 0s4-2 6 0 4 2 6 0 4-2 6 0"/>
              </svg>
              <span>Sea</span>
            </button>
            <button type="button" class="chip" data-value="instagram">
              <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="18" height="18" rx="5" ry="5"/>
                <circle cx="12" cy="12" r="4"/>
                <circle cx="17.5" cy="6.5" r="1"/>
              </svg>
              <span>Instagram</span>
            </button>
            <button type="button" class="chip" data-value="history">
              <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 3-6.7"/>
                <path d="M3 4v5h5"/>
                <path d="M12 7v5l3 2"/>
              </svg>
              <span>History</span>
            </button>
            <button type="button" class="chip" data-value="main_streets">
              <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 3h8l3 18H5L8 3Z"/>
                <path d="M12 7v3"/>
                <path d="M12 13v3"/>
              </svg>
              <span>Main Streets</span>
            </button>
            <button type="button" class="chip" data-value="food">
              <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 3v7"/>
                <path d="M8 3v7"/>
                <path d="M11 3v7"/>
                <path d="M8 10v11"/>
                <path d="M16 3c0 4 0 6 3 7v11"/>
                <path d="M16 3v18"/>
              </svg>
              <span>Food</span>
            </button>
            <button type="button" class="chip" data-value="chill">
              <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 21c5-2 8-6 8-11-5 0-9 3-11 8"/>
                <path d="M9 12c-2 0-4 1-6 3 1 3 3 5 6 6"/>
              </svg>
              <span>Chill</span>
            </button>
          </div>
        </div>

        <div class="input-group">
          <label>Detour tolerance</label>
          <div class="chip-group" id="detour-chips">
            <button type="button" class="chip" data-value="low">Low</button>
            <button type="button" class="chip selected" data-value="medium">Medium</button>
            <button type="button" class="chip" data-value="high">High</button>
          </div>
        </div>

        <div class="input-group">
          <label>Max extra time</label>
          <div class="chip-group" id="budget-chips">
            <button type="button" class="chip" data-value="5">+5 min</button>
            <button type="button" class="chip" data-value="10">+10 min</button>
            <button type="button" class="chip selected" data-value="15">+15 min</button>
            <button type="button" class="chip" data-value="25">+25 min</button>
          </div>
        </div>

        <div class="input-group">
          <label>Places availability</label>
          <div class="chip-group" id="open-now-chips">
            <button type="button" class="chip selected" data-value="open">
              Open now
            </button>
            <button type="button" class="chip" data-value="any">
              Any time
            </button>
          </div>
        </div>

        <div id="error-message" class="error-message hidden"></div>

        <button type="submit" id="submit-btn" class="primary-btn">Find Routes</button>
      </form>
    </section>

    <button type="button" id="history-toggle" class="history-toggle" aria-label="Open search history" title="Search history">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 3-6.7"/>
        <path d="M3 4v5h5"/>
        <path d="M12 8v5l3 2"/>
      </svg>
      <span id="history-count" class="history-count hidden"></span>
    </button>

    <div id="history-backdrop" class="history-backdrop" aria-hidden="true"></div>

    <aside id="history-panel" class="history-panel" aria-hidden="true" aria-label="Search history">
      <header class="history-panel-header">
        <h2>Search History</h2>
        <button type="button" id="close-history" class="history-close-btn" aria-label="Close history">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </header>
      <p class="history-panel-subtitle">Tap any item to refill the form.</p>
      <div id="history-list" class="history-panel-list"></div>
      <button type="button" id="clear-history" class="clear-history-btn hidden">Clear history</button>
    </aside>

    <!-- Loading Screen -->
    <section id="loading-screen" class="screen">
      <div class="loading-content">
        <div class="loader"></div>
        <p>Finding scenic routes...</p>
      </div>
    </section>

    <!-- Results Screen -->
    <section id="results-screen" class="screen">
      <button id="back-btn" class="back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        New search
      </button>
      <div id="route-summary" class="route-summary"></div>
      <div id="route-cards"></div>
    </section>

    <!-- Rating Modal -->
    <div id="rating-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <p class="modal-title">How was this route suggestion?</p>
        <div class="star-rating" id="star-rating">
          <button class="star" data-value="1">&#9733;</button>
          <button class="star" data-value="2">&#9733;</button>
          <button class="star" data-value="3">&#9733;</button>
          <button class="star" data-value="4">&#9733;</button>
          <button class="star" data-value="5">&#9733;</button>
        </div>
        <button id="skip-rating" class="dismiss-btn">Skip</button>
      </div>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
